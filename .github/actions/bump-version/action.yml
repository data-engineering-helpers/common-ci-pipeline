name: Bump version
description: Bump the version and adds a commit

inputs:
  version:
    description: The version to be upgraded.
    default: ""
    required: true
  branch-name:
    description: The name of the branch where the upgrade must take place
    default: ""
    required: true
  repo-token:
    description: The GitHub token used to create release
    required: false
    default: ${{ github.token }}
  version-file-path:
    description: Optional version file path
    default: "VERSION"
    required: false

runs:
  using: composite

  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch-name }}
        token: ${{ inputs.repo-token }}
      env:
        GITHUB_TOKEN: ${{ inputs.repo-token }}

    - name: Upgrade version
      run: make upgrade version=${{inputs.version }} || true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.repo-token }}

    - name: Commit changes and push to repository
      uses: EndBug/add-and-commit@v9.1.4
      with:
        default_author: github_actions
        message: "Upgrade version to ${{ inputs.version }}"
      env:
        GITHUB_TOKEN: ${{ inputs.repo-token }}
